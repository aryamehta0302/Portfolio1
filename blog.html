  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const yearSpan = document.querySelector('.copyright span:first-child');
      if (yearSpan) yearSpan.innerHTML = `Copyright &copy; ${new Date().getFullYear()}`;

      // Render Blog Grid
      const grid = document.getElementById('blog-grid');
      if (grid && window.BlogData) {
        window.BlogData.forEach(article => {
          const col = document.createElement('div');
          col.className = 'col-lg-4 col-md-6';
          
          col.innerHTML = `
            <a href="article.html?id=${article.id}" class="text-decoration-none h-100 d-block">
              <div class="v2-card h-100 d-flex flex-column v2-card--hover-lift">
                <div class="mb-3 d-flex align-items-center gap-2">
                  <span class="v2-tag" style="background: var(--v2-accent); color: #000; border: none; font-weight: 600;">${article.category}</span>
                  <span style="color: var(--v2-text-tertiary); font-size: 0.8rem;">${article.date}</span>
                </div>
                <h3 style="font-family: var(--v2-font-heading); font-size: 1.25rem; font-weight: 600; color: var(--v2-text-primary); margin-bottom: 0.75rem;">${article.title}</h3>
                <p style="color: var(--v2-text-secondary); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem; flex-grow: 1;">${article.summary}</p>
                <div style="color: var(--v2-accent); font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; margin-top: auto;">
                  Read Article <i class="bi bi-arrow-right"></i>
                </div>
              </div>
            </a>
          `;
          grid.appendChild(col);
        });
      }
    });
  </script>
