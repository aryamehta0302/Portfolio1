  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const yearSpan = document.querySelector('.copyright span:first-child');
      if (yearSpan) yearSpan.innerHTML = `Copyright &copy; ${new Date().getFullYear()}`;

      // Render Article
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = urlParams.get('id');
      
      const headerEl = document.getElementById('article-header');
      const contentEl = document.getElementById('article-content');
      
      if (articleId && window.BlogData) {
        const article = window.BlogData.find(a => a.id === articleId);
        
        if (article) {
          document.title = `${article.title} - Arya Mehta`;
          
          const readTime = article.readTime || '5 min read';
          const difficulty = article.difficulty || 'Intermediate';
          
          headerEl.innerHTML = `
            <div class="mb-3 d-flex align-items-center gap-3 flex-wrap">
              <span class="v2-tag" style="background: var(--v2-accent); color: #fff; border: none; font-weight: 600; padding: 6px 14px;">${article.category}</span>
              <span class="v2-tag"><i class="bi bi-clock" style="margin-right: 4px;"></i> ${readTime}</span>
              <span class="v2-tag"><i class="bi bi-bar-chart" style="margin-right: 4px;"></i> ${difficulty}</span>
              <span style="color: var(--v2-text-tertiary); font-size: 0.9rem;"><i class="bi bi-calendar3" style="margin-right: 4px;"></i> ${article.date}</span>
            </div>
            <h1 class="mb-3" style="font-family: var(--v2-font-heading); font-size: 2.8rem; font-weight: 700; color: var(--v2-text-primary); line-height: 1.2; letter-spacing: -0.02em;">${article.title}</h1>
            ${article.summary ? `<p class="lead mb-0" style="color: var(--v2-text-secondary); font-size: 1.15rem; line-height: 1.6;">${article.summary}</p>` : ''}
          `;
          contentEl.innerHTML = article.content;
          
          // Initialize Engineering Notebook features
          setTimeout(() => {
            if (window.V2) {
              if (window.V2.AutoTOC) new window.V2.AutoTOC('.article-content', 'toc-container');
              if (window.V2.CopyCode) new window.V2.CopyCode();
            }
            
            // Add copy link functionality
            const copyLinkBtn = document.getElementById('copy-link-btn');
            if (copyLinkBtn) {
              copyLinkBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(window.location.href);
                copyLinkBtn.innerHTML = '<i class="bi bi-check2"></i>';
                setTimeout(() => copyLinkBtn.innerHTML = '<i class="bi bi-link-45deg"></i>', 2000);
              });
            }
          }, 100);
        } else {
          contentEl.innerHTML = `<h2>Article not found.</h2><p>The article you're looking for doesn't exist.</p>`;
        }
      } else {
        contentEl.innerHTML = `<h2>No article specified.</h2><p>Please return to the blog and select an article.</p>`;
      }
    });
  </script>
